#Configure the data source
spring:
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  datasource:
    druid:
      db-type: com.alibaba.druid.pool.DruidDataSource
      driverClassName: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:eladmin}?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useSSL=false
      username: ${DB_USER:root}
      password: ${DB_PWD:123456}
      # Initial number of connections, recommended to be the same as the minimum idle connections
      initial-size: 20
      # Minimum idle connections, keep enough idle connections to handle requests
      min-idle: 20
      # Maximum connections, increase appropriately according to concurrency needs
      max-active: 50
      # Connection acquisition timeout (ms), adjust to meet response time requirements
      max-wait: 3000
      # Enable the KeepAlive mechanism to keep long connections
      keep-alive: true
      # Connection validity check interval (ms), periodically checks connection health
      time-between-eviction-runs-millis: 60000
      # Minimum lifetime of a connection in the pool (ms), to ensure connections stay for at least some time
      min-evictable-idle-time-millis: 300000
      # Maximum lifetime of a connection in the pool (ms), to keep connections from staying too long
      max-evictable-idle-time-millis: 900000
      # Whether the connection is validated by the idle connection evictor(If there is)to validate. If validation fails,then the connection will be removed from the pool
      test-while-idle: true
      # Whether to validate a connection before taking it from the pool,If validation fails, then remove the connection from the pool and try to take another
      test-on-borrow: true
      # Whether to validate a connection before returning it to the pool
      test-on-return: false
      # Disable the com_ping liveness mechanism
      use-ping-method: false
      # Check whether the connection is valid
      validation-query: SELECT 1
      # Configure monitoring statistics
      webStatFilter:
        enabled: true
      stat-view-servlet:
        allow:
        enabled: true
        # Console admin username and password
        url-pattern: /druid/*
        reset-enable: false
        login-username: admin
        login-password: 123456
      filter:
        stat:
          enabled: true
          # Log slow SQL
          log-slow-sql: true
          slow-sql-millis: 2000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true

# Login-related config
login:
  #  Whether to restrict users to a single login
  single-login: false
  # Redis User login cache config
  user-cache:
    # Time to live (seconds)
    idle-time: 21600
  #  Verification code
  code:
    #  Captcha type configuration, see the LoginProperties class
    code-type: arithmetic
    #  Login image captcha validity (minutes)
    expiration: 2
    #  Captcha height
    width: 111
    #  Captcha width
    height: 36
    # Content length
    length: 2
    # Font name, the default font is used if empty; if garbled text appears online, set another font
    font-name:
    # Font size
    font-size: 25

#jwt
jwt:
  header: Authorization
  # Token prefix
  token-start-with: Bearer
  # The token must be Base64-encoded with at least 88 bits
  base64-secret: ZmQ0ZGI5NjQ0MDQwY2I4MjMxY2Y3ZmI3MjdhN2ZmMjNhODViOTg1ZGE0NTBjMGM4NDA5NzYxMjdjOWMwYWRmZTBlZjlhNGY3ZTg4Y2U3YTE1ODVkZDU5Y2Y3OGYwZWE1NzUzNWQ2YjFjZDc0NGMxZWU2MmQ3MjY1NzJmNTE0MzI=
  # Token expiration time, unit: milliseconds, default 2 hours, can be generated on this website https://www.convertworld.com/zh-hans/time/milliseconds.html
  token-validity-in-seconds: 7200000
  # Online Users key
  online-key: "online_token:"
  # Verification code
  code-key: "captcha_code:"
  # token Renewal check window (default 30 minutes, unit: milliseconds by default); if the user acts shortly before the token expires, the token is renewed
  detect: 1800000
  # Renewal time range, default 1 hour, unit: milliseconds
  renew: 3600000

#Whether code generation is allowed; set it in production to false
generator:
  enabled: false

#To enable swagger in production, configure the request URL
#springfox:
#  documentation:
#    swagger:
#      v2:
#        host: # API domain or public network ip

#Whether to enable swagger-ui
swagger:
  enabled: false

# File storage path
file:
  mac:
    path: ~/file/
    avatar: ~/avatar/
  linux:
    path: /home/eladmin/file/
    avatar: /home/eladmin/avatar/
  windows:
    path: C:\eladmin\file\
    avatar: C:\eladmin\avatar\
  # File size /M
  maxSize: 100
  avatarMaxSize: 5

# Amazon S3 protocol cloud storage configuration
#Supports Qiniu Cloud, Alibaba Cloud OSS, Tencent Cloud COS, Huawei Cloud OBS, China Mobile Cloud EOS, etc.
amz:
  s3:
    # Region
    region: test
    # The region's corresponding endpoint
    endPoint: https://s3.test.com
    # Domain accessed
    domain: https://s3.test.com
    # Authentication info of the account, or of a sub-account
    accessKey: Fill in your AccessKey
    secretKey: Fill in your SecretKey
    # Bucket
    defaultBucket: Fill in your bucket name
    # File storage path
    timeformat: yyyy-MM