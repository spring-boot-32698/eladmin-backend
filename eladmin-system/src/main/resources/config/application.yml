server:
  port: 8000
  http2:
    # Enable HTTP/2 support to improve transfer efficiency
    enabled: true
  compression:
    # Enable GZIP compression to reduce the amount of transferred data
    enabled: true
    # MIME types to compress
    mime-types: text/html, text/xml, text/plain, application/json
    # Minimum response size to compress (bytes)

spring:
  freemarker:
    check-template-location: false
  profiles:
    # Active profile; if you need quartz distributed support, change it active: dev,quartz
    active: dev
  data:
    redis:
      repositories:
        enabled: false
#  pid:
#    file: /Specify the location yourself/eladmin.pid

  #Config Jpa
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL5InnoDBDialect

  redis:
    #Database index
    database: ${REDIS_DB:0}
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PWD:}
    #Connection timeout
    timeout: 5000
    # Connection pool config
    lettuce:
      pool:
        # Maximum connections in the pool
        max-active: 30
        # Maximum blocking wait time of the pool (ms), a negative value means no limit
        max-wait: -1
        # Maximum idle connections in the pool
        max-idle: 20
        # Minimum idle connections in the pool
        min-idle: 1

task:
  pool:
    # Core thread pool size
    core-pool-size: 10
    # Maximum thread count
    max-pool-size: 30
    # Active time
    keep-alive-seconds: 60
    # Queue capacity
    queue-capacity: 50

#Email verification code validity (seconds)
code:
  expiration: 300

#Passwords are transmitted encrypted: encrypted with the public key on the front end and decrypted with the private key on the back end
rsa:
  private_key: 