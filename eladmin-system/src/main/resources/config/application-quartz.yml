# Configure quartz distributed support, sql The files are in the sql directory and must be imported into the database; you also need to modify the following in application.yml: active: dev Config
spring:
  quartz:
    # Required, specify JDBC storage
    job-store-type: jdbc
    properties:
      org:
        quartz:
          scheduler:
            # Required, specify the scheduler instance name
            instanceName: eladmin
            # Required, specify the scheduler instance's ID
            instanceId: auto
          threadPool:
            # Optional, thread count of the thread pool, adjust as needed
            threadCount: 5
          jobStore:
            # Optional, remove it if you do not need a cluster
            isClustered: true
            # Optional, cluster check interval, adjust as needed
            clusterCheckinInterval: 10000
            # Required, specify the JDBC driver delegate class
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
            # Optional, whether to use property storage, adjust as needed
            useProperties: false
            # Required, specify the table prefix
            tablePrefix: qrtz_
            # Optional, specify the misfire threshold, adjust as needed
            misfireThreshold: 60000