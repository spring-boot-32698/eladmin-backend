# Interception module of the application
modulelist=com.p6spy.engine.logging.P6LogFactory,com.p6spy.engine.outage.P6OutageFactory

# Custom log printing
logMessageFormat=me.zhengjie.config.CustomP6SpyLogger

# Output logs to the console
appender=com.p6spy.engine.spy.appender.Slf4JLogger

# Date format
dateformat=yyyy-MM-dd HH:mm:ss

# There can be multiple actual drivers
driverlist=com.mysql.cj.jdbc.Driver

# Whether to enable slow SQL logging
outagedetection=true

# Slow SQL threshold: 2 seconds
outagedetectioninterval=2

# Whether to filter Log
filter=true

# SQL keywords excluded when filtering Log, separated by commas
exclude=SELECT 1,INSERT INTO sys_log

# Configure exceptions for Log recording,Result sets that can be removed:error,info,batch,debug,statement,commit,rollback,result,resultset.
excludecategories=info,debug,result,commit,resultset